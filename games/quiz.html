<!doctype html>
<html lang="id" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtara Quiz - Virtara Arcade</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="arcade.css">
<script>
  tailwind.config = { theme: { extend: {
    colors: { 'virtara': { 'deep-red':'#8B1538','bright-red':'#C41E3A','gold':'#D4AF37','light-gold':'#F4D03F','cream':'#FDF5E6','warm-brown':'#8B4513','dark':'#1A0F0F','surface':'#2D1F1F','accent':'#E8C547' } },
    fontFamily: { 'display': ['Playfair Display','serif'], 'body': ['Plus Jakarta Sans','sans-serif'] }
  } } }
</script>
<style>.no-scrollbar::-webkit-scrollbar{display:none}</style>
</head>
<body class="h-full bg-virtara-dark text-virtara-cream font-body min-h-screen animated-gradient batik-pattern">

<div id="arcadeNav"></div>

<main class="max-w-3xl mx-auto px-4 py-12">

  <!-- Category select -->
  <div id="categoryView">
    <div class="text-center mb-10">
      <h1 class="font-display text-3xl md:text-4xl font-bold merdeka-gradient-text mb-2">🧠 Virtara Quiz</h1>
      <p class="text-virtara-cream/70">Pilih kategori dan jawab semua soal untuk mendapatkan poin sebanyak-banyaknya.</p>
    </div>
    <div id="categoryGrid" class="grid sm:grid-cols-3 gap-5"></div>
  </div>

  <!-- Question view -->
  <div id="questionView" class="hidden">
    <div class="flex items-center justify-between mb-4 text-sm text-virtara-cream/60">
      <span id="qProgress"></span>
      <span id="qScore" class="text-virtara-gold font-semibold"></span>
    </div>
    <div class="xp-bar-track mb-8"><div id="qProgressBar" class="xp-bar-fill" style="width:0%"></div></div>
    <div class="arcade-card p-8">
      <h2 id="qText" class="font-display text-xl md:text-2xl font-semibold mb-6"></h2>
      <div id="qOptions" class="grid gap-3"></div>
    </div>
  </div>

  <!-- Result view -->
  <div id="resultView" class="hidden text-center">
    <div class="arcade-card p-10">
      <i data-lucide="trophy" class="w-14 h-14 text-virtara-gold mx-auto mb-4"></i>
      <h2 class="font-display text-3xl font-bold mb-2">Quiz Selesai!</h2>
      <p id="resultScore" class="text-virtara-gold text-xl font-semibold mb-6"></p>
      <div class="grid grid-cols-2 gap-3 max-w-xs mx-auto mb-8 text-sm">
        <div class="arcade-stat p-3"><p id="resultCorrect" class="text-lg font-bold text-virtara-gold"></p><p class="text-virtara-cream/50 text-xs">Benar</p></div>
        <div class="arcade-stat p-3"><p id="resultWrong" class="text-lg font-bold text-virtara-gold"></p><p class="text-virtara-cream/50 text-xs">Salah</p></div>
      </div>
      <div id="reviewList" class="text-left space-y-2 mb-8 max-h-72 overflow-y-auto"></div>
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <button id="playAgainBtn" class="px-6 py-3 rounded-lg border border-virtara-gold/50 hover:bg-virtara-gold/10 transition-colors">Kategori Lain</button>
        <a href="leaderboard.html?game=quiz" class="px-6 py-3 rounded-lg bg-gradient-to-r from-virtara-bright-red to-virtara-deep-red font-semibold gold-glow hover:scale-[1.02] transition-transform">Lihat Leaderboard</a>
      </div>
    </div>
  </div>

</main>

<script>window.__firebaseReady = new Promise(res => { window.__resolveFirebaseReady = res; });</script>
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/firebase-db.js"></script>
<script src="js/arcade-core.js"></script>
<script src="js/arcade-shell.js"></script>
<script src="js/quiz-data.js"></script>
<script>
  let currentCategory = null;
  let qIndex = 0;
  let score = 0;
  let review = [];

  function renderCategories() {
    const grid = document.getElementById('categoryGrid');
    grid.innerHTML = Object.entries(QUIZ_DATA).map(([key, cat]) => `
      <button data-cat="${key}" class="cat-btn arcade-card p-6 text-center">
        <div class="text-4xl mb-3">${cat.icon}</div>
        <p class="font-display font-bold">${cat.label}</p>
        <p class="text-xs text-virtara-cream/50 mt-1">${cat.questions.length} soal</p>
      </button>`).join('');
    grid.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => startQuiz(btn.dataset.cat));
    });
  }

  function startQuiz(catKey) {
    currentCategory = catKey;
    qIndex = 0;
    score = 0;
    review = [];
    document.getElementById('categoryView').classList.add('hidden');
    document.getElementById('resultView').classList.add('hidden');
    document.getElementById('questionView').classList.remove('hidden');
    ArcadeCore.markGamePlayed('quiz');
    renderQuestion();
  }

  function renderQuestion() {
    const cat = QUIZ_DATA[currentCategory];
    const total = cat.questions.length;
    const q = cat.questions[qIndex];
    document.getElementById('qProgress').textContent = `Soal ${qIndex + 1} / ${total}`;
    document.getElementById('qScore').textContent = `Skor: ${score}`;
    document.getElementById('qProgressBar').style.width = `${(qIndex / total) * 100}%`;
    document.getElementById('qText').textContent = q.q;
    const optHolder = document.getElementById('qOptions');
    optHolder.innerHTML = q.options.map((opt, i) => `
      <button data-i="${i}" class="opt-btn text-left px-5 py-3 rounded-lg border border-virtara-gold/25 hover:border-virtara-gold hover:bg-virtara-gold/10 transition-colors">
        ${opt}
      </button>`).join('');
    optHolder.querySelectorAll('.opt-btn').forEach(btn => {
      btn.addEventListener('click', () => answer(parseInt(btn.dataset.i)));
    });
  }

  function answer(i) {
    const cat = QUIZ_DATA[currentCategory];
    const q = cat.questions[qIndex];
    const correct = i === q.answer;
    if (correct) score += 1;
    review.push({ q: q.q, chosen: q.options[i], correctText: q.options[q.answer], correct });

    const optHolder = document.getElementById('qOptions');
    optHolder.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
    const btns = optHolder.querySelectorAll('.opt-btn');
    btns[q.answer].classList.add('!border-green-400', '!bg-green-400/10');
    if (!correct) btns[i].classList.add('!border-virtara-bright-red', '!bg-virtara-bright-red/10');

    setTimeout(() => {
      qIndex += 1;
      if (qIndex >= cat.questions.length) finishQuiz();
      else renderQuestion();
    }, 700);
  }

  function finishQuiz() {
  document.getElementById('questionView').classList.add('hidden');
  document.getElementById('resultView').classList.remove('hidden');
  const total = QUIZ_DATA[currentCategory].questions.length;
  document.getElementById('resultScore').textContent = `Skor akhir: ${score} poin`;
  document.getElementById('resultCorrect').textContent = score;
  document.getElementById('resultWrong').textContent = total - score;
  document.getElementById('reviewList').innerHTML = review.map(r => `
    <div class="flex items-start gap-2 text-sm p-2 rounded ${r.correct ? 'bg-green-400/5' : 'bg-virtara-bright-red/5'}">
      <i data-lucide="${r.correct ? 'check' : 'x'}" class="w-4 h-4 mt-0.5 shrink-0 ${r.correct ? 'text-green-400' : 'text-virtara-bright-red'}"></i>
      <div>
        <p class="text-virtara-cream/80">${r.q}</p>
        ${r.correct ? '' : `<p class="text-xs text-virtara-cream/50">Jawabanmu: ${r.chosen} • Benar: ${r.correctText}</p>`}
      </div>
    </div>`).join('');
  lucide.createIcons();

  ArcadeCore.addXp(score * 5);
  ArcadeCore.addCoin(score);
  
  // Update stats with new updateStat function
  ArcadeCore.updateStat('quiz', {
    lastScore: score, 
    lastCategory: currentCategory,
    playCount: ((ArcadeCore.getPlayer()?.stats?.quiz?.playCount) || 0) + 1,
  });
  
  if (score === total) {
    ArcadeShell.unlockWithToast('perfect_quiz');
    if (currentCategory === 'kemerdekaan') ArcadeShell.unlockWithToast('patriot');
  }
  ArcadeShell.unlockWithToast('quiz_master');

  const p = ArcadeCore.getPlayer();
  ArcadeCore.ArcadeDB.submitScore('quiz', { 
    uuid: p.uuid, 
    username: p.username, 
    score, 
    category: currentCategory 
  });
  ArcadeShell.renderNav('quiz.html');
}

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    document.getElementById('resultView').classList.add('hidden');
    document.getElementById('categoryView').classList.remove('hidden');
  });

  ArcadeShell.init({
    activePath: 'quiz.html',
    onReady: () => { renderCategories(); lucide.createIcons(); }
  });
</script>
</body>
</html>
